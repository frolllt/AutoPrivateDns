name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Version and rename APK
        run: |
          # Extrai a versao de app/build.gradle.kts
          VERSION=$(grep 'versionName =' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            VERSION="1.0.0"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

          # Localiza o APK gerado
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "APK encontrado em: $APK_PATH"

          mkdir -p release-apks
          # Copia com versao no nome e versao simplificada
          cp "$APK_PATH" "release-apks/autoprivatedns-v${VERSION}.apk"
          cp "$APK_PATH" "release-apks/autoprivatedns.apk"

          echo "Arquivos prontos para distribuicao:"
          ls -lh release-apks/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoprivatedns-v${{ env.APP_VERSION }}
          path: release-apks/autoprivatedns-v${{ env.APP_VERSION }}.apk

      - name: Create / Update GitHub Release
        if: (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}-build.{1}', env.APP_VERSION, github.run_number) }}
          name: AutoPrivateDns v${{ env.APP_VERSION }} (Build ${{ github.run_number }})
          files: |
            release-apks/autoprivatedns-v${{ env.APP_VERSION }}.apk
            release-apks/autoprivatedns.apk
          generate_release_notes: true
